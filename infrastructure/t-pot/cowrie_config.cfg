# Cowrie SSH/Telnet Honeypot Configuration
# Emulates a vulnerable SSH/Telnet server to capture attacker behavior
# Version: 2.5.0

[honeypot]
# Hostname presented to attackers
hostname = srv-prod-01

# Log location
log_path = /var/log/cowrie

# Downloaded files (malware samples)
download_path = /var/lib/cowrie/downloads
download_limit_size = 50000000

# Filesystem emulation
contents_path = honeyfs
filesystem_file = fs.pickle

# TTY log location
ttylog_path = /var/log/cowrie/tty

# Interactive timeout (seconds)
interactive_timeout = 300

# Backend (shell, proxy)
backend = shell

# Timezone
timezone = UTC

# Authentication
auth_class = UserDB

# SSH version string (looks like Ubuntu)
ssh_version_string = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

# Telnet enabled
telnet_enabled = true

# ==========================================
# SSH Configuration
# ==========================================
[ssh]
enabled = true
rsa_public_key = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key
dsa_public_key = etc/ssh_host_dsa_key.pub
dsa_private_key = etc/ssh_host_dsa_key

version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5
listen_endpoints = tcp:2222:interface=0.0.0.0

# Allow password authentication
auth_type = password,publickey

# Forward connection attempts
forwarding = true
forward_redirect = false

# ==========================================
# Telnet Configuration
# ==========================================
[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# Telnet banner
banner = Ubuntu 20.04.5 LTS\nLogin:

# ==========================================
# Output Plugins
# ==========================================

# JSON logging (primary)
[output_jsonlog]
enabled = true
logfile = /var/log/cowrie/cowrie.json
epoch_timestamp = false

# Text logging (backup)
[output_textlog]
enabled = true
logfile = /var/log/cowrie/cowrie.log

# Elasticsearch output (direct)
[output_elasticsearch]
enabled = false
host = elasticsearch
port = 9200
index = cowrie
type = cowrie

# MySQL output (optional)
[output_mysql]
enabled = false

# ==========================================
# Database (UserDB for authentication)
# ==========================================
[database_jsonlog]
enabled = false

# ==========================================
# User Authentication
# Weak credentials to attract attackers
# ==========================================
[userdb]
userdb_file = etc/userdb.txt

# Common weak credentials (simulated)
# Format: username:password
# Examples:
# - root:root
# - admin:admin
# - root:123456
# - ubuntu:ubuntu
# - pi:raspberry

# ==========================================
# Fake Filesystem
# ==========================================
[fs]
# Emulate Ubuntu 20.04 filesystem
arch = linux-x64-lsb

# Fake file contents
[txtcmds]
enabled = true

# ==========================================
# Download Limits
# ==========================================
[download]
# Maximum file size (50MB)
download_limit_size = 52428800

# Download path
download_path = /var/lib/cowrie/downloads

# ==========================================
# Proxy (for connection forwarding)
# ==========================================
[proxy]
enabled = false

# ==========================================
# Backend Pool
# ==========================================
[backend_pool]
pool_only = false

# ==========================================
# Shell Configuration
# ==========================================
[shell]
# Filesystem pickle
filesystem = share/cowrie/fs.pickle

# Process list
processes = share/cowrie/cmdoutput.json

# Architecture
arch = linux-x64-lsb

# Kernel version
kernel_version = 5.4.0-135-generic
kernel_build_string = #152-Ubuntu SMP Wed Nov 23 20:19:22 UTC 2022

# Hardware
hardware_platform = x86_64
operating_system = GNU/Linux

# Prompt
prompt = root@srv-prod-01:~#

# ==========================================
# MITRE ATT&CK Logging
# ==========================================
[mitre]
enabled = true
logfile = /var/log/cowrie/mitre.json

# ==========================================
# Malware Analysis
# ==========================================
[malware]
# Sandbox malware downloads (optional)
sandbox_enabled = false

# ==========================================
# Advanced Interaction
# ==========================================

# Python interpreter emulation
[python]
enabled = true

# Ping command emulation
[ping]
enabled = true

# Curl/wget emulation
[curl]
enabled = true

[wget]
enabled = true

# ==========================================
# Logging Verbosity
# ==========================================
[log]
# Log level: DEBUG, INFO, WARN, ERROR
level = INFO

# ==========================================
# DEPLOYMENT NOTES
# ==========================================
# 1. Create userdb.txt with weak credentials:
#    echo "root:x:0:0:root:/root:/bin/bash" > etc/userdb.txt
#    echo "admin:x:1000:1000:admin:/home/admin:/bin/bash" >> etc/userdb.txt
#
# 2. Generate SSH keys:
#    ssh-keygen -t rsa -f etc/ssh_host_rsa_key -N ""
#    ssh-keygen -t dsa -f etc/ssh_host_dsa_key -N ""
#
# 3. Ensure log directories exist:
#    mkdir -p /var/log/cowrie /var/lib/cowrie/downloads
#
# 4. Expected attacker behavior:
#    - SSH brute force attempts
#    - Credential stuffing
#    - Command execution (wget malware, nc reverse shells)
#    - File upload/download attempts
#    - Lateral movement commands
#
# 5. MITRE ATT&CK techniques typically observed:
#    - T1021.004: SSH remote services
#    - T1110: Brute force
#    - T1059: Command-line interface
#    - T1105: Ingress tool transfer
#    - T1083: File/directory discovery
#
# 6. Maintenance:
#    - Monitor download_path for malware samples
#    - Rotate logs weekly
#    - Update filesystem emulation quarterly
#    - Review credential effectiveness monthly
