# Logstash Pipeline Configuration
# Honeypot Log Parsing, Enrichment & IOC Extraction
# Version: 1.0

input {
  # ==========================================
  # COWRIE SSH/Telnet Honeypot Logs
  # ==========================================
  file {
    path => "/var/log/cowrie/cowrie.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "cowrie"
    tags => ["honeypot", "ssh", "telnet", "cowrie"]
  }

  # ==========================================
  # DIONAEA Multi-Protocol Honeypot Logs
  # ==========================================
  file {
    path => "/var/log/dionaea/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "dionaea"
    tags => ["honeypot", "dionaea", "multi-protocol"]
  }

  # ==========================================
  # SURICATA IDS Logs (EVE JSON)
  # ==========================================
  file {
    path => "/var/log/suricata/eve.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "suricata"
    tags => ["ids", "suricata", "network"]
  }

  # ==========================================
  # BEATS Input (Optional)
  # ==========================================
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # ==========================================
  # TIMESTAMP NORMALIZATION
  # ==========================================
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # ==========================================
  # COWRIE LOG PROCESSING
  # ==========================================
  if [type] == "cowrie" {
    # Extract session metadata
    mutate {
      add_field => {
        "honeypot_type" => "cowrie"
        "protocol" => "%{[protocol]}"
        "session_id" => "%{[session]}"
      }
    }

    # Extract attacker IP and credentials
    if [src_ip] {
      mutate {
        add_field => { "attacker_ip" => "%{[src_ip]}" }
      }

      # GeoIP enrichment
      geoip {
        source => "attacker_ip"
        target => "geoip"
        database => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
      }

      # ASN lookup
      geoip {
        source => "attacker_ip"
        target => "geoip_asn"
        database => "/usr/share/logstash/geoip/GeoLite2-ASN.mmdb"
      }
    }

    # Extract authentication attempts
    if [eventid] == "cowrie.login.success" or [eventid] == "cowrie.login.failed" {
      mutate {
        add_field => {
          "auth_result" => "%{[eventid]}"
          "username_attempted" => "%{[username]}"
          "password_attempted" => "%{[password]}"
        }
        add_tag => ["authentication_attempt"]
      }
    }

    # Extract executed commands
    if [eventid] == "cowrie.command.input" {
      mutate {
        add_field => {
          "command_executed" => "%{[input]}"
        }
        add_tag => ["command_execution"]
      }

      # Classify command by MITRE ATT&CK technique
      if [input] =~ /wget|curl|fetch/ {
        mutate {
          add_field => { "mitre_technique" => "T1105" }  # Ingress Tool Transfer
          add_tag => ["mitre_attck", "initial_access"]
        }
      }

      if [input] =~ /chmod|chown|sudo/ {
        mutate {
          add_field => { "mitre_technique" => "T1548" }  # Abuse Elevation Control
          add_tag => ["mitre_attck", "privilege_escalation"]
        }
      }

      if [input] =~ /\/etc\/passwd|\/etc\/shadow|cat \/proc/ {
        mutate {
          add_field => { "mitre_technique" => "T1083" }  # File and Directory Discovery
          add_tag => ["mitre_attck", "discovery"]
        }
      }

      if [input] =~ /nc|netcat|\/bin\/sh|\/bin\/bash/ {
        mutate {
          add_field => { "mitre_technique" => "T1059" }  # Command and Scripting Interpreter
          add_tag => ["mitre_attck", "execution"]
        }
      }

      if [input] =~ /rm -rf|dd if=/ {
        mutate {
          add_field => { "mitre_technique" => "T1485" }  # Data Destruction
          add_tag => ["mitre_attck", "impact"]
        }
      }
    }

    # Extract file downloads (malware samples)
    if [eventid] == "cowrie.session.file_download" {
      mutate {
        add_field => {
          "downloaded_file" => "%{[outfile]}"
          "file_url" => "%{[url]}"
          "file_hash" => "%{[shasum]}"
        }
        add_tag => ["malware_download", "ioc"]
      }
    }
  }

  # ==========================================
  # DIONAEA LOG PROCESSING
  # ==========================================
  if [type] == "dionaea" {
    mutate {
      add_field => { "honeypot_type" => "dionaea" }
    }

    # Extract connection metadata
    if [remote_host] {
      mutate {
        add_field => { "attacker_ip" => "%{[remote_host]}" }
      }

      # GeoIP enrichment
      geoip {
        source => "attacker_ip"
        target => "geoip"
        database => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
      }

      geoip {
        source => "attacker_ip"
        target => "geoip_asn"
        database => "/usr/share/logstash/geoip/GeoLite2-ASN.mmdb"
      }
    }

    # Extract protocol-specific IOCs
    if [connection_protocol] {
      mutate {
        add_field => { "protocol" => "%{[connection_protocol]}" }
      }
    }

    # Malware binary detection
    if [md5_hash] or [sha256_hash] {
      mutate {
        add_tag => ["malware_sample", "ioc"]
      }
    }

    # HTTP-specific parsing
    if [connection_protocol] == "http" {
      if [http_request_url] {
        mutate {
          add_field => { "http_url" => "%{[http_request_url]}" }
          add_tag => ["http_request"]
        }
      }

      if [http_request_url] =~ /\.php|\.asp|\.jsp|cgi-bin/ {
        mutate {
          add_field => { "mitre_technique" => "T1190" }  # Exploit Public-Facing Application
          add_tag => ["mitre_attck", "initial_access", "web_exploit"]
        }
      }
    }

    # SMB-specific parsing
    if [connection_protocol] == "smb" {
      mutate {
        add_field => { "mitre_technique" => "T1021.002" }  # SMB/Windows Admin Shares
        add_tag => ["mitre_attck", "lateral_movement"]
      }
    }

    # MySQL/MSSQL brute force detection
    if [connection_protocol] =~ /mysql|mssql/ {
      mutate {
        add_field => { "mitre_technique" => "T1110" }  # Brute Force
        add_tag => ["mitre_attck", "credential_access"]
      }
    }
  }

  # ==========================================
  # SURICATA IDS PROCESSING
  # ==========================================
  if [type] == "suricata" {
    mutate {
      add_field => { "sensor_type" => "suricata_ids" }
    }

    # Extract source IP
    if [src_ip] {
      mutate {
        add_field => { "attacker_ip" => "%{[src_ip]}" }
      }

      geoip {
        source => "attacker_ip"
        target => "geoip"
        database => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
      }
    }

    # Alert classification
    if [alert] {
      mutate {
        add_field => {
          "alert_signature" => "%{[alert][signature]}"
          "alert_category" => "%{[alert][category]}"
          "alert_severity" => "%{[alert][severity]}"
        }
        add_tag => ["ids_alert"]
      }
    }

    # Extract network flows
    if [event_type] == "flow" {
      mutate {
        add_field => {
          "bytes_transferred" => "%{[flow][bytes_toserver]}"
          "packets_sent" => "%{[flow][pkts_toserver]}"
        }
        add_tag => ["network_flow"]
      }
    }
  }

  # ==========================================
  # IOC EXTRACTION (Cross-Platform)
  # ==========================================

  # Extract all IP addresses from any field
  if [attacker_ip] {
    mutate {
      add_tag => ["ioc_ip"]
    }
  }

  # Extract URLs and domains
  if [http_url] or [file_url] {
    ruby {
      code => '
        url = event.get("http_url") || event.get("file_url")
        if url
          begin
            require "uri"
            uri = URI.parse(url)
            event.set("extracted_domain", uri.host)
            event.set("extracted_path", uri.path)
            event.tag("ioc_domain")
          rescue
            # Invalid URL, skip
          end
        end
      '
    }
  }

  # Extract file hashes
  if [file_hash] or [md5_hash] or [sha256_hash] {
    mutate {
      add_tag => ["ioc_hash"]
    }
  }

  # ==========================================
  # THREAT SCORING
  # ==========================================
  ruby {
    code => '
      threat_score = 0

      # Increment score based on indicators
      threat_score += 10 if event.get("tags")&.include?("malware_download")
      threat_score += 20 if event.get("tags")&.include?("malware_sample")
      threat_score += 15 if event.get("tags")&.include?("command_execution")
      threat_score += 10 if event.get("tags")&.include?("authentication_attempt")
      threat_score += 25 if event.get("tags")&.include?("web_exploit")
      threat_score += 15 if event.get("tags")&.include?("ids_alert")

      # Add bonus for multiple IOCs
      ioc_count = 0
      ioc_count += 1 if event.get("tags")&.include?("ioc_ip")
      ioc_count += 1 if event.get("tags")&.include?("ioc_domain")
      ioc_count += 1 if event.get("tags")&.include?("ioc_hash")
      threat_score += (ioc_count * 5)

      event.set("threat_score", threat_score)

      # Classify severity
      if threat_score >= 50
        event.set("threat_severity", "critical")
      elsif threat_score >= 30
        event.set("threat_severity", "high")
      elsif threat_score >= 15
        event.set("threat_severity", "medium")
      else
        event.set("threat_severity", "low")
      end
    '
  }

  # ==========================================
  # CLEANUP & NORMALIZATION
  # ==========================================
  mutate {
    remove_field => ["host", "path", "beat"]
    lowercase => ["protocol"]
  }

  # Add ingest timestamp
  ruby {
    code => 'event.set("ingested_at", Time.now.utc.iso8601)'
  }
}

output {
  # ==========================================
  # ELASTICSEARCH OUTPUT
  # ==========================================
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
    index => "honeypot-%{honeypot_type}-%{+YYYY.MM.dd}"

    # Index template for proper field mappings
    template_name => "honeypot-template"
    template_overwrite => true
  }

  # ==========================================
  # HIGH-SEVERITY ALERTS TO SEPARATE INDEX
  # ==========================================
  if [threat_severity] == "critical" or [threat_severity] == "high" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
      index => "honeypot-alerts-%{+YYYY.MM.dd}"
    }
  }

  # ==========================================
  # IOC INDEX (Separate for Threat Intel)
  # ==========================================
  if "ioc" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
      index => "honeypot-iocs-%{+YYYY.MM.dd}"
    }
  }

  # ==========================================
  # DEBUG OUTPUT (Optional - disable in prod)
  # ==========================================
  # stdout {
  #   codec => rubydebug
  # }
}

# ==========================================
# PIPELINE NOTES
# ==========================================
# This Logstash pipeline:
# 1. Ingests logs from Cowrie, Dionaea, Suricata
# 2. Enriches with GeoIP and ASN data
# 3. Extracts IOCs (IPs, domains, hashes)
# 4. Maps attacks to MITRE ATT&CK techniques
# 5. Scores threat severity
# 6. Outputs to Elasticsearch indices
#
# Indices created:
# - honeypot-cowrie-YYYY.MM.DD (SSH/Telnet logs)
# - honeypot-dionaea-YYYY.MM.DD (Multi-protocol logs)
# - honeypot-suricata-YYYY.MM.DD (IDS alerts)
# - honeypot-alerts-YYYY.MM.DD (High-severity events)
# - honeypot-iocs-YYYY.MM.DD (Extracted indicators)
#
# Required GeoIP databases:
# - /usr/share/logstash/geoip/GeoLite2-City.mmdb
# - /usr/share/logstash/geoip/GeoLite2-ASN.mmdb
#
# Download from: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
